# NetSchool school hub (pilot). Sirlar ./secrets/ da (gitignored) — README'ga qarang.
name: netschool

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      NETSCHOOL_DB_PASSWORD_FILE: /run/secrets/netschool_db_password
      MESHCENTRAL_DB_PASSWORD_FILE: /run/secrets/meshcentral_db_password
    secrets: [postgres_superuser_password, netschool_db_password, meshcentral_db_password]
    networks: [hub]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # initdb paytidagi vaqtinchalik server faqat socket'da tinglaydi — TCP orqali tekshiriladi.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  meshcentral:
    build:
      context: ../..
      dockerfile: infra/meshcentral/Dockerfile
    environment:
      MESHCENTRAL_DB_PASSWORD_FILE: /run/secrets/meshcentral_db_password
      # API `wss://meshcentral:4430` ga hostname tekshiruvi bilan ulanadi: sertifikat shu nomga chiqariladi.
      MESHCENTRAL_CERT_NAME: meshcentral
      # entrypoint.sh shu parol bilan `netschool-svc` service account'ini (yo'q bo'lsa) yaratadi.
      MESHCENTRAL_SERVICE_PASSWORD_FILE: /run/secrets/meshcentral_service_password
      # Gateway (api) manzili: X-Forwarded-For faqat shu IP'dan ishoniladi. DNS nomi emas — MeshCentral uni
      # faqat ishga tushishda aniqlaydi, api esa undan keyin ko'tariladi.
      MESHCENTRAL_TRUSTED_PROXY: ${API_IP:-172.31.250.10}
    secrets: [meshcentral_db_password, meshcentral_service_password]
    networks: [hub]
    volumes:
      - meshcentral-data:/opt/meshcentral/meshcentral-data
      - meshcentral-files:/opt/meshcentral/meshcentral-files
      # api bilan bo'lishiladi: faqat root-cert-public.crt (private key'lar meshcentral-data'da qoladi).
      - meshcentral-ca:/run/meshcentral-ca
    healthcheck:
      # api'ga berilgan CA fayli bor va 4430 shu CA hamda cert nomi bilan TLS javob beradi (tekshiruv o'chirilmaydi).
      test:
        - CMD
        - node
        - -e
        - >-
          const ca = require('fs').readFileSync('/run/meshcentral-ca/root-cert-public.crt');
          require('https').get({ host: '127.0.0.1', port: 4430, servername: process.env.MESHCENTRAL_CERT_NAME, ca },
          (res) => process.exit(res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1));
      interval: 5s
      timeout: 5s
      retries: 12
      # Birinchi ishga tushishda sertifikatlar va service account yaratiladi.
      start_period: 180s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api-migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/cli.mjs", "migrate"]
    environment:
      DATABASE_URL_FILE: /run/secrets/netschool_database_url
    secrets: [netschool_database_url]
    networks: [hub]
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required, e.g. https://hub.school.lan}
      API_PORT: "8443"
      TLS_CERT_FILE: /run/secrets/api_tls_cert
      TLS_KEY_FILE: /run/secrets/api_tls_key
      DATABASE_URL_FILE: /run/secrets/netschool_database_url
      MESHCENTRAL_URL: wss://meshcentral:4430/control.ashx
      MESHCENTRAL_USERNAME: netschool-svc
      MESHCENTRAL_PASSWORD_FILE: /run/secrets/meshcentral_service_password
      MESHCENTRAL_CA_FILE: /run/meshcentral-ca/root-cert-public.crt
      # Remote session gateway (ikkinchi HTTPS listener, xuddi shu TLS sertifikati bilan).
      GATEWAY_PORT: "8444"
      GATEWAY_PUBLIC_ORIGIN: ${GATEWAY_PUBLIC_ORIGIN:?GATEWAY_PUBLIC_ORIGIN is required, e.g. https://hub.school.lan:8444}
    secrets: [api_tls_cert, api_tls_key, netschool_database_url, meshcentral_service_password]
    networks:
      hub:
        # Qat'iy manzil: meshcentral `trustedProxy` shu IP (MESHCENTRAL_TRUSTED_PROXY).
        ipv4_address: ${API_IP:-172.31.250.10}
    volumes:
      - meshcentral-ca:/run/meshcentral-ca:ro
    ports:
      - "443:8443"
      - "8444:8444"
    depends_on:
      postgres:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
      meshcentral:
        condition: service_healthy
    restart: unless-stopped

networks:
  # Qat'iy subnet: api IP'si (gateway) MeshCentral'da trusted proxy. Maktab LAN'i bilan to'qnashsa HUB_SUBNET,
  # HUB_DYNAMIC_RANGE va API_IP ni .env'da birga almashtiring: API_IP subnet ichida, lekin dinamik diapazondan tashqarida
  # (aks holda boshqa konteyner, masalan `compose run`, shu manzilni olib qo'yishi mumkin).
  hub:
    ipam:
      config:
        - subnet: ${HUB_SUBNET:-172.31.250.0/24}
          ip_range: ${HUB_DYNAMIC_RANGE:-172.31.250.128/25}

secrets:
  postgres_superuser_password:
    file: ./secrets/postgres_superuser_password
  netschool_db_password:
    file: ./secrets/netschool_db_password
  meshcentral_db_password:
    file: ./secrets/meshcentral_db_password
  meshcentral_service_password:
    file: ./secrets/meshcentral_service_password
  netschool_database_url:
    file: ./secrets/netschool_database_url
  api_tls_cert:
    file: ./secrets/api_tls_cert
  api_tls_key:
    file: ./secrets/api_tls_key

volumes:
  pgdata:
  meshcentral-data:
  meshcentral-files:
  meshcentral-ca:
